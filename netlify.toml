[build]
  base = "web-frontend"
  command = "npm run build"
  publish = "dist"

# Same-origin API proxy to Render backend (avoids CORS on Netlify preview URLs)
[[redirects]]
  from = "/api/*"
  to = "https://white-queen-attendance.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

